<!DOCTYPE html>
<!--
  The module's own UI, served by the KernelSU/Magisk manager from webroot/.

  It does no thinking of its own: every piece of data comes from sync-tool
  (--status, --packages, --get-config) and every change goes back through it
  (--set-config), so the page and the running policy can never disagree about
  which format a file is in. The tool is the one place that reads and writes the
  config, and it validates before it writes.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>HMA UID Fake</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>HMA UID Fake</h1>
        <p class="sub" id="subtitle">kernel-side uid guard</p>
      </div>
      <button id="refresh" class="icon-btn" title="Refresh">&#x21bb;</button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="status">Status</button>
      <button class="tab" data-tab="apps">Apps</button>
      <button class="tab" data-tab="templates">Templates</button>
      <button class="tab" data-tab="raw">Raw</button>
    </nav>

    <main>
      <section id="tab-status" class="panel active">
        <div id="status-cards" class="cards"></div>
        <div class="row">
          <button id="sync-now" class="primary">Sync now</button>
        </div>
      </section>

      <section id="tab-apps" class="panel">
        <div class="row">
          <input id="app-search" type="search" placeholder="Search packages" />
          <select id="app-filter">
            <option value="callers">Callers only</option>
            <option value="user">User apps</option>
            <option value="all">All apps</option>
          </select>
        </div>
        <p class="hint" id="apps-hint"></p>
        <ul id="app-list" class="list"></ul>
      </section>

      <section id="tab-templates" class="panel">
        <div class="row">
          <input id="tpl-name" placeholder="new template name" />
          <button id="tpl-add">Add</button>
        </div>
        <p class="hint">
          A template is a named list of packages. A caller that applies it hides
          everything on it, the same way it would hide its own list.
        </p>
        <ul id="tpl-list" class="list"></ul>
      </section>

      <section id="tab-raw" class="panel">
        <p class="hint" id="raw-path"></p>
        <textarea id="raw-json" spellcheck="false"></textarea>
        <div class="row">
          <button id="raw-load">Reload from file</button>
          <button id="raw-apply" class="primary">Apply</button>
        </div>
      </section>
    </main>

    <div id="editor" class="modal hidden">
      <div class="modal-card">
        <header>
          <h2 id="editor-title">Hide targets</h2>
          <button id="editor-close" class="icon-btn">&#x2715;</button>
        </header>
        <div class="row wrap">
          <input id="editor-search" type="search" placeholder="Search targets" />
          <label class="chk"
            ><input type="checkbox" id="editor-all" /> Hide everything</label
          >
          <label class="chk"
            ><input type="checkbox" id="editor-whitelist" /> Whitelist</label
          >
          <label class="chk"
            ><input type="checkbox" id="editor-system" /> System apps</label
          >
        </div>
        <p class="hint" id="editor-hint"></p>
        <ul id="editor-list" class="list scroll"></ul>
        <footer>
          <button id="editor-remove" class="danger">Remove rule</button>
          <button id="editor-save" class="primary">Done</button>
        </footer>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <div id="busy" class="busy hidden"><div class="spinner"></div></div>

    <script src="app.js"></script>
  </body>
</html>
